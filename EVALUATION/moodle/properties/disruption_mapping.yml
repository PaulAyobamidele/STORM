# disruption_mapping.yml  —  Moodle case study
# ===========================================================================
# THE HYBRID EIGHT.
#
# The previous set was eight variants of "a write fails" — which is Moodle's
# STRONGEST area. quiz_attempt::process_finish wraps its writes in
# start_delegated_transaction and rolls back on exception, rendering an
# errorbox; those faults produce a clean PASS. A suite aimed at the system's
# strongest seam cannot discriminate a resilient system from a lucky one.
#
# This set aims at seams found weak by READING the SUT. Choosing where to look
# is test selection and is legitimate; deciding the verdict in advance is not.
# Nothing here encodes an expected outcome, and APP1_WRITE_FAIL is retained
# precisely because it is expected to PASS.
#
# ---------------------------------------------------------------------------
# WHY TRIGGERS, NOT PRIVILEGE REVOCATION
# ---------------------------------------------------------------------------
# REVOKE does not work here: moodle-docker runs PostgreSQL with
# POSTGRES_USER=moodle, so the application's role is the cluster SUPERUSER and
# bypasses every permission check. The REVOKE would succeed and the writes
# would keep working — a fault that never bites.
#
# A BEFORE trigger that RAISEs is not bypassable, fails writes only (reads stay
# intact, which is what the model says), names one table precisely, and drops
# cleanly. Every fault carries verify_injected / verify_restored probes so the
# injector confirms the fault bit AND confirms it let go.
#
# ---------------------------------------------------------------------------
# THERE IS NO CRON CONTAINER
# ---------------------------------------------------------------------------
# moodle-docker runs no cron service; cron is invoked manually via
# admin/cli/cron.php. So INFRA_CRON_DEAD is not "stop a service" — it disables
# the specific scheduled task row and lets cron run anyway, which is both more
# precise and verifiable.
#
# Consumer: framework/concretization/disruptor.py
# Self-test: python3 framework/scripts/check_faults.py <this file>
# ===========================================================================

mechanisms:
  postgres:
    command: ["bin/moodle-docker-compose", "exec", "-T", "db",
              "psql", "-U", "moodle", "-d", "moodle", "-tAc"]
    cwd: "EVALUATION/moodle/sut/moodle-docker"
    timeout: 90
    env:
      MOODLE_DOCKER_WWWROOT: "{{PROJECT_ROOT}}/EVALUATION/moodle/sut/moodle"
      MOODLE_DOCKER_DB: "pgsql"
      MOODLE_DOCKER_WEB_PORT: "8080"

  shell:
    command: ["bash", "-lc"]
    cwd: "EVALUATION/moodle/sut/moodle-docker"
    timeout: 120
    env:
      MOODLE_DOCKER_WWWROOT: "{{PROJECT_ROOT}}/EVALUATION/moodle/sut/moodle"
      MOODLE_DOCKER_DB: "pgsql"
      MOODLE_DOCKER_WEB_PORT: "8080"

faults:

  # ─── APP level ───────────────────────────────────────────────────────────

  APP1_WRITE_FAIL:
    advice_category: A1
    dependability_property: persistence / write integrity
    control: true
    mechanism: postgres
    description: >
      EXPECTED-PASS CONTROL. The quiz-attempt write fails. process_finish runs
      inside a delegated transaction, so a correct system rolls the attempt
      back and surfaces the error — which is what Moodle is expected to do.
      A sweep in which everything fails is exactly as suspect as one in which
      nothing does; this is what makes the other seven credible. If THIS one
      fails, suspect the tester before suspecting Moodle.
      Scoped to UPDATEs that set state='finished'. The specification disrupts
      ATTEMPT_PERSISTED -- the persistence of a FINISHED attempt, which
      process_finish performs as an UPDATE of m_quiz_attempts.
      Two rounds of narrowing, both forced by measurement against the live SUT
      with the trigger pre-installed:
        BEFORE INSERT OR UPDATE  -- the attempt could not be created at all.
        BEFORE UPDATE            -- the attempt row was created (4:inprogress)
                                    but the question page never rendered, so
                                    the walk could not reach the finish it was
                                    supposed to disrupt. Moodle updates the
                                    attempt row during START as well as finish.
        BEFORE UPDATE ... WHEN (NEW.state = 'finished')  -- current.
      A trigger that blocks the setup makes the case report a walker timeout
      rather than a verdict about Moodle, which is the opposite of the point.
    # Installed BEFORE the walk. The concrete actions for a gate are emitted
    # before the gate, and the fault gate sits after the stimulus, so at gate
    # time the attempt has already been written: measured, the transition
    # immediately preceding APP1_WRITE_FAIL is CLICK !SEL_SUBMIT_CONFIRM_BTN.
    timing: pre
    inject: |
      CREATE OR REPLACE FUNCTION storm_fault_raise() RETURNS trigger
        LANGUAGE plpgsql AS $fn$ BEGIN
          RAISE EXCEPTION 'storm injected fault on %', TG_TABLE_NAME;
        END $fn$;
      DROP TRIGGER IF EXISTS storm_app1_write_fail ON m_quiz_attempts;
      CREATE TRIGGER storm_app1_write_fail
        BEFORE UPDATE ON m_quiz_attempts
        FOR EACH ROW WHEN (NEW.state = 'finished')
        EXECUTE FUNCTION storm_fault_raise();
    restore: "DROP TRIGGER IF EXISTS storm_app1_write_fail ON m_quiz_attempts;"
    verify_injected:
      payload: "SELECT count(*) FROM pg_trigger WHERE tgname='storm_app1_write_fail';"
      equals: "1"
    verify_restored:
      payload: "SELECT count(*) FROM pg_trigger WHERE tgname='storm_app1_write_fail';"
      equals: "0"

  APP_PARTIAL_SUBMISSION:
    advice_category: A2
    dependability_property: atomicity / write consistency
    mechanism: postgres
    description: >
      THE NON-ATOMIC WRITE. mod/assign/locallib.php save_submission() has NO
      delegated transaction: the only ones in that file wrap
      get_user_submission/get_group_submission, which create the submission ROW
      rather than its CONTENT. So the status row (m_assign_submission) and the
      text row (m_assignsubmission_onlinetext) are written independently.
      Failing ONLY the content write leaves the status advanced over text that
      was never stored. The oracle is SUBMISSION_STATUS(asn, st): after this
      fault the specification offers NO_SUBMISSION and never SUBMITTED_FG.
      Scoped to INSERT, and the fixture now sets submissiondrafts=0.
      MEASURED, and the reason for both:
        With submissiondrafts=1 a save never advanced the status at all (it
        stayed 'Draft (not submitted)'; only a separate "Submit assignment"
        action advanced it), so the single non-atomic operation the model
        describes did not exist in the SUT and the property was unreachable by
        any concrete path.
        With submissiondrafts=0 ONE save writes both: measured
        'new | (NO ROW)' -> 'submitted | REVISION-PLACEHOLDER'. That save
        creates the content row, so INSERT -- not UPDATE -- is the write to
        fail if the status is to be caught advancing over absent content.
    # The trigger must be in place BEFORE the save it blocks. Measured: the
    # transition immediately preceding APP_PARTIAL_SUBMISSION is
    # CLICK !SEL_SAVE_CHANGES_BTN, so injecting at gate time installed it after
    # the content write had committed and the fault bit nothing at all.
    timing: pre
    inject: |
      CREATE OR REPLACE FUNCTION storm_fault_raise() RETURNS trigger
        LANGUAGE plpgsql AS $fn$ BEGIN
          RAISE EXCEPTION 'storm injected fault on %', TG_TABLE_NAME;
        END $fn$;
      DROP TRIGGER IF EXISTS storm_partial_submission ON m_assignsubmission_onlinetext;
      CREATE TRIGGER storm_partial_submission
        BEFORE INSERT ON m_assignsubmission_onlinetext
        FOR EACH ROW EXECUTE FUNCTION storm_fault_raise();
    restore: "DROP TRIGGER IF EXISTS storm_partial_submission ON m_assignsubmission_onlinetext;"
    verify_injected:
      payload: "SELECT count(*) FROM pg_trigger WHERE tgname='storm_partial_submission';"
      equals: "1"
    verify_restored:
      payload: "SELECT count(*) FROM pg_trigger WHERE tgname='storm_partial_submission';"
      equals: "0"

  APP_GRADE_STALE_SUB:
    advice_category: A3
    dependability_property: consistency / stale read
    mechanism: postgres
    description: >
      THE SUBMISSION CHANGES UNDER THE GRADER. Moodle detects this on the
      SUBMISSION side ($string['submissionmodified'] — "The submission has been
      modified by somebody else") but process_save_grade() performs no
      equivalent check, so a teacher can grade text they never read.
      Injected by advancing the stored content directly, simulating the student
      saving between the grader opening the form and pressing save. The oracle
      is the pair GRADING_SHOWS(asn, v) ... CONFIRMED_GRADE(asn, g, v'): the
      specification offers a confirmed grade only against the version shown, or
      STALE_WARNING_SHOWN.
    inject: |
      UPDATE m_assignsubmission_onlinetext
         SET onlinetext = '<p>REVISION-FINAL</p>'
       WHERE submission IN (SELECT id FROM m_assign_submission WHERE assignment = 1);
    restore: |
      UPDATE m_assignsubmission_onlinetext
         SET onlinetext = '<p>REVISION-PLACEHOLDER</p>'
       WHERE submission IN (SELECT id FROM m_assign_submission WHERE assignment = 1);
    verify_injected:
      payload: "SELECT count(*) FROM m_assignsubmission_onlinetext WHERE onlinetext LIKE '%REVISION-FINAL%';"
      equals: "1"
    verify_restored:
      payload: "SELECT count(*) FROM m_assignsubmission_onlinetext WHERE onlinetext LIKE '%REVISION-FINAL%';"
      equals: "0"

  APP_LAZY_REGRADE:
    advice_category: A4
    dependability_property: consistency / deferred aggregate
    mechanism: postgres
    description: >
      THE DEFERRED AGGREGATE. grade_item->needsupdate defaults to 1 and
      recompute is deferred through grade_regrade_final_grades_if_required(),
      so a course total can be read before it reflects its components. Setting
      needsupdate on the course item reproduces exactly the state Moodle
      itself leaves behind after a component grade changes.
      The oracle is COURSE_TOTAL(crs, g): once a component grade is persisted
      the specification offers only GRADE_FULL.
      RISK, stated up front: Moodle may recompute on report VIEW, in which case
      the stale total is never observable and this PASSes. That is a legitimate
      outcome, not a reason to weaken the mapping.
    inject: |
      UPDATE m_grade_items SET needsupdate = 1
       WHERE courseid = 2 AND itemtype = 'course';
    restore: |
      UPDATE m_grade_items SET needsupdate = 0
       WHERE courseid = 2 AND itemtype = 'course';
    verify_injected:
      payload: "SELECT count(*) FROM m_grade_items WHERE courseid=2 AND itemtype='course' AND needsupdate=1;"
      equals: "1"
    verify_restored:
      payload: "SELECT count(*) FROM m_grade_items WHERE courseid=2 AND itemtype='course' AND needsupdate=1;"
      equals: "0"

  # ─── DATABASE level ──────────────────────────────────────────────────────

  DB_ATTEMPT_STEP_LOSS:
    advice_category: D1
    dependability_property: persistence / answer integrity
    mechanism: postgres
    description: >
      ANSWER DATA LOST WHILE THE ATTEMPT STILL FINISHES. The question engine
      writes answer state to m_question_attempt_steps; the attempt row itself
      lives in m_quiz_attempts. Failing the step write while leaving the
      attempt row writable asks whether Moodle can report an attempt as graded
      without the answers that produced the grade.
      The oracle is ATTEMPT_STATE(att, st): after this fault the specification
      requires FAILED, never GRADED.
      Scoped to sequencenumber > 0. MEASURED against the live fixture by
      driving the quiz and reading m_question_attempt_steps after each action:
        start attempt              -> 0:todo
        select answer + finish     -> 0:todo, 1:complete
        submit all and finish      -> 0:todo, 1:complete, 2:gradedright
      Step 0 IS the attempt existing, so blocking it stops the attempt being
      created rather than losing its answers. Blocking everything above 0
      loses exactly the answer and grading steps, which is the fault the
      specification describes.
    # Pre-installed for the same reason as the other two write blockers:
    # measured, the transition immediately preceding DB_ATTEMPT_STEP_LOSS is
    # CLICK !SEL_SUBMIT_CONFIRM_BTN, by which point every step already exists.
    timing: pre
    inject: |
      CREATE OR REPLACE FUNCTION storm_fault_raise() RETURNS trigger
        LANGUAGE plpgsql AS $fn$ BEGIN
          RAISE EXCEPTION 'storm injected fault on %', TG_TABLE_NAME;
        END $fn$;
      DROP TRIGGER IF EXISTS storm_attempt_step_loss ON m_question_attempt_steps;
      CREATE TRIGGER storm_attempt_step_loss
        BEFORE INSERT OR UPDATE ON m_question_attempt_steps
        FOR EACH ROW WHEN (NEW.sequencenumber > 0)
        EXECUTE FUNCTION storm_fault_raise();
    restore: "DROP TRIGGER IF EXISTS storm_attempt_step_loss ON m_question_attempt_steps;"
    verify_injected:
      payload: "SELECT count(*) FROM pg_trigger WHERE tgname='storm_attempt_step_loss';"
      equals: "1"
    verify_restored:
      payload: "SELECT count(*) FROM pg_trigger WHERE tgname='storm_attempt_step_loss';"
      equals: "0"

  # ─── INFRASTRUCTURE level ────────────────────────────────────────────────

  INFRA_CRON_DEAD:
    advice_category: I1
    dependability_property: liveness / scheduled-task dependence
    mechanism: postgres
    description: >
      MOODLE DEPENDS ON CRON FOR CORRECTNESS, NOT MERELY TIMELINESS.
      \mod_quiz\task\update_overdue_attempts is a scheduled_task; with
      overduehandling=autosubmit it is what closes an attempt left open past
      its deadline. Disabled, the attempt stays IN_PROGRESS forever and the
      student's work is never graded — no error, no notice, just silence.
      Disabling the task row (rather than stopping a service, of which there is
      none) is precise: cron may still run, and this specific task will not.
      The oracle is ATTEMPT_STATE(att, st): after the deadline the
      specification offers only terminal states, never IN_PROGRESS.
      REQUIRES the quiz to have a time limit — see seed_moodle.php. With
      timelimit=0 no attempt can ever become overdue and this fault is
      unreachable rather than passing.
    inject: |
      UPDATE m_task_scheduled SET disabled = 1
       WHERE classname = '\mod_quiz\task\update_overdue_attempts';
    restore: |
      UPDATE m_task_scheduled SET disabled = 0
       WHERE classname = '\mod_quiz\task\update_overdue_attempts';
    verify_injected:
      payload: "SELECT count(*) FROM m_task_scheduled WHERE classname='\\mod_quiz\\task\\update_overdue_attempts' AND disabled=1;"
      equals: "1"
    verify_restored:
      payload: "SELECT count(*) FROM m_task_scheduled WHERE classname='\\mod_quiz\\task\\update_overdue_attempts' AND disabled=1;"
      equals: "0"

  # ─── USER level ──────────────────────────────────────────────────────────

  UE1_LOSE_CONN:
    advice_category: U1
    dependability_property: availability / client connectivity
    network: true
    mechanism: shell
    description: >
      The client loses connectivity mid-attempt. Pausing the webserver freezes
      it mid-request, so the browser's in-flight call never completes and quiz
      autosave cannot reach the server — which is exactly what the model says
      this fault is.

      WHY THIS IS SAFE HERE, having been rejected earlier: HTMLExecutor uses a
      LOCAL webdriver (webdriver.Chrome/Firefox in executors.py, not
      webdriver.Remote), so the browser runs on the HOST and the moodle-docker
      selenium container is unused by this pipeline. Pausing the webserver
      therefore cuts browser -> SUT and nothing else: the driver still reaches
      the browser, and the verify probes still reach the db container. If the
      executor is ever switched to a remote webdriver this becomes unsafe again
      and must be revisited.

      NOT iptables: the moodlehq/moodle-php-apache image does not ship it
      (`command -v iptables` -> not found), so the previous rule silently did
      nothing while `|| true` hid the failure.
      NOT `docker network disconnect` on the selenium container: harmless here
      only because that container is unused, and actively wrong the moment it
      is not.

      Moodle's own observable is #connection-error on the attempt page — it
      ships hidden and is unhidden when autosave cannot reach the server.
    inject: "docker pause moodle-docker-webserver-1"
    restore: "docker unpause moodle-docker-webserver-1 2>/dev/null || true"
    verify_injected:
      payload: "docker inspect -f '{{.State.Paused}}' moodle-docker-webserver-1"
      equals: "true"
    verify_restored:
      payload: "docker inspect -f '{{.State.Paused}}' moodle-docker-webserver-1"
      equals: "false"

  UE2_SESSION_EXPIRE:
    advice_category: U2
    dependability_property: availability / session integrity
    mechanism: postgres
    description: >
      The student's session is invalidated mid-flow. Deleting the row from
      m_sessions is exactly what Moodle's own session garbage collector does,
      so the next request takes the genuine expiry path and renders
      "Your session has timed out. Please log in again."
      (lang/en/error.php:548) rather than a simulated message.
    inject: "DELETE FROM m_sessions WHERE userid = 3;"
    # Sessions are recreated by logging in again; there is nothing to undo.
    restore: "SELECT 1;"
    verify_injected:
      payload: "SELECT count(*) FROM m_sessions WHERE userid = 3;"
      equals: "0"
    verify_restored:
      payload: "SELECT 1;"
      equals: "1"
