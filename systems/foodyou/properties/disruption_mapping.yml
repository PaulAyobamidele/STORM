# disruption_mapping.yml
# Android fault-injection contract for FoodYou's 8 disruptions. Consumed by
# framework/concretization/fault_injector.py (AndroidFaultInjector): when the
# graph walker reaches a fault gate (or, for `pre` faults, before the walk) the
# injector runs the adb/sqlite command; `restore` undoes it at run end.
#
#   {pkg} = app package, {db} = Room DB path (resolved from --device-config).
#   timing:  pre  = inject once before the walk (fault pre-exists the read/write)
#            gate = inject when the fault gate label is reached (mid-flow)
#            none = no out-of-band injection (the AUT itself drives it)
#   mechanism: adb | sqlite | connectivity | none
#   restore:   a command string, "" (nothing), or `reseed` (re-run seed_foods.sh)

android:
  package: com.maksimowiczm.foodyou
  db: databases/open_source_database.db
  seed_script: systems/foodyou/seed_foods.sh

faults:

  EXTAPI_FAIL:                      # external API unreachable -> app degrades (warning)
    timing: gate
    mechanism: connectivity
    inject:  "svc data disable ; svc wifi disable"
    restore: "svc data enable ; svc wifi enable"

  # ===========================================================================
  # THE THREE WRITE-PATH FAULTS. Rewritten 2026-08-23.
  #
  # All three previously ran BYTE-IDENTICAL SQL: one fault under three names,
  # giving three rows in a results table that could not disagree. And that SQL was
  # `DELETE FROM Measurement; ...`, which ERASES THE DIARY and drives the daily
  # total to EMPTY -- while the specification says an aborted write leaves the
  # total UNCHANGED:
  #
  #     UE1_KILL;      CONFIRM_TOTAL (ROLLED_BACK, total, fid)
  #     DISRUPTION_DB; CONFIRM_TOTAL (ROLLED_BACK, total, fid)
  #     STORAGE_FULL;  CONFIRM_TOTAL (ROLLED_BACK, total, fid)
  #
  # `total` there is the UNBUMPED value. The old injection would therefore have
  # failed all three purposes for a reason the application did not cause: 326 test
  # cases of manufactured counter-example.
  #
  # They are now three stressors on ONE requirement, failing at three different
  # layers -- process, SQL, filesystem. Same promise, three independent
  # implementation paths, any of which can be wrong on its own.
  #
  # NONE of the three may be trusted until check_faults.sh reports BITES for it. A
  # fault that does not manifest yields a PASS that means nothing.
  # ===========================================================================
  UE1_KILL:                         # process killed mid-write, then relaunched
    # PROCESS layer. The previous note here said a literal kill "would break the
    # remaining steps" -- true of a kill alone, which is why the relaunch is part
    # of the injection. FoodYou reopens on Home, which is exactly where the next
    # modelled step (`wait_for el_daily_total`, `observe el_daily_total`) expects
    # to be, so the walk continues.
    #
    # Whether the in-flight write committed depends on timing, and that is a
    # PROPERTY OF THE APPLICATION, not a defect in the injection. The specification
    # targets the abort branch; if the app reports COMMITTED instead, that is a
    # result to investigate rather than a reason to weaken the specification.
    timing: gate
    mechanism: adb
    inject:  "am force-stop {pkg} ; am start -n {pkg}/.app.infrastructure.android.MainActivity"
    restore: ""                     # the relaunch above is the restore

  DISRUPTION_DB:                    # write transaction aborts
    # SQL layer, and the cleanest of the three: the insert raises, the transaction
    # rolls back, Room surfaces the exception. This is literally what "the write
    # transaction aborts" means, rather than a simulation of its aftermath -- and
    # unlike the old DELETE it does not touch rows already committed, so the total
    # stays where the specification says it should.
    #
    # Its presence in the schema is directly probeable, which is why manifested()
    # can answer for this fault with certainty.
    # 2026-09-30: gate -> pre. With `gate' the fault fired when the walker reached
    # this gate, AFTER ADD_ENTRY's concrete steps -- the Save tap IS the write --
    # so the write had already committed and every FAIL was a timing artefact
    # (v2 disruption_db: 83/83 FAILs injected after the last Save; HANDOVER.md s.4).
    # The purpose's only write is the targeted ADD_ENTRY, so arming before the
    # walk strikes exactly that write.
    timing: pre
    mechanism: sqlite
    inject:  "CREATE TRIGGER IF NOT EXISTS fault_abort_write BEFORE INSERT ON Measurement BEGIN SELECT RAISE(ABORT, 'injected transaction abort'); END"
    restore: "DROP TRIGGER IF EXISTS fault_abort_write"

  STORAGE_FULL:                     # write fails for lack of storage
    # FILESYSTEM layer. NOT chmod: the previous note in this file established that
    # permissions are checked at open, and the app holds the database open, so a
    # read-only flag never reaches an in-flight write. A full filesystem does,
    # because ENOSPC is returned on the write itself regardless of when the handle
    # was opened.
    #
    # The ballast is sized from actual free space, leaving 20 MB of headroom so the
    # rest of Android keeps running. `&&` rather than `;` throughout: the injector
    # splits adb commands on `;`, which would shred a compound one-liner.
    #
    # LEAST CERTAIN OF THE THREE -- it is the only one whose command has not been
    # exercised on a device. Validate with check_faults.sh before any sweep, and if
    # the ballast cannot fill the partition, fall back to the trigger mechanism and
    # record STORAGE_FULL and DISRUPTION_DB as sharing a layer.
    # 2026-09-30: gate -> pre. With `gate' the fault fired when the walker reached
    # this gate, AFTER ADD_ENTRY's concrete steps -- the Save tap IS the write --
    # so the write had already committed and every FAIL was a timing artefact
    # (v2 disruption_db: 83/83 FAILs injected after the last Save; HANDOVER.md s.4).
    # The purpose's only write is the targeted ADD_ENTRY, so arming before the
    # walk strikes exactly that write.
    timing: pre
    mechanism: adb
    inject:  "run-as {pkg} sh -c 'FREE=$(df -k . | tail -1 | tr -s \" \" | cut -d\" \" -f4) && dd if=/dev/zero of=files/fault_ballast bs=1024 count=$((FREE-20480)) 2>/dev/null && sync'"
    restore: "run-as {pkg} rm -f files/fault_ballast"

  # NOTE ON TARGETING AND RESTORE.
  # These used to hit `name LIKE 'Test%'` -- rows seed_foods.sh created. The foods
  # under test are now REAL products from the Swiss Food Composition Database, so
  # a Test% injection would corrupt rows nothing looks at and the purpose would
  # pass having disturbed nothing. They must name the foods actually under test.
  #
  # That means writing to SHIPPED data, so `restore: reseed` is no longer enough:
  # seed_foods.sh can re-insert Test* rows, it cannot repair a Swiss one. Restore
  # therefore writes the authoritative energies back explicitly. They are the same
  # values as Calorie.abstract_values in type_description.yml -- if you change one,
  # change both, and check_env.sh asserts they still match before any run.
  #
  # If a run is interrupted between inject and restore the catalogue stays
  # corrupted and every later run silently tests against bad data. check_env.sh
  # is what catches that; do not skip it.

  DB_CORRUPT:                       # corrupted local record (unsound energy)
    timing: pre
    mechanism: sqlite
    inject:  "UPDATE Product SET energy = NULL WHERE name IN ('Peanut butter','Cooking butter','Corn germ oil')"
    restore: "UPDATE Product SET energy = 636 WHERE name = 'Peanut butter'; UPDATE Product SET energy = 745 WHERE name = 'Cooking butter'; UPDATE Product SET energy = 900 WHERE name = 'Corn germ oil'"

  CACHE_STALE:                      # stale nutrition (not the authoritative value)
    timing: pre
    mechanism: sqlite
    inject:  "UPDATE Product SET energy = 999 WHERE name IN ('Peanut butter','Cooking butter','Corn germ oil')"
    restore: "UPDATE Product SET energy = 636 WHERE name = 'Peanut butter'; UPDATE Product SET energy = 745 WHERE name = 'Cooking butter'; UPDATE Product SET energy = 900 WHERE name = 'Corn germ oil'"

  STORAGE_MEDIA:                    # storage read error (DB file unreadable)
    timing: gate
    mechanism: adb
    # 0660, not 0600. Android creates the database group-writable (-rw-rw----) and
    # restoring to 0600 silently drops the group bit, so every run left the file a
    # little more restricted than it found it -- a slow drift that check_env.sh
    # does not test for and that would eventually change app behaviour for reasons
    # nothing in the sweep could explain. Caught by check_faults.sh on 2026-08-23:
    #   before='-rw-rw----'  during='----------'  after='-rw-------'
    # THE CHMOD ALONE DOES NOTHING TO A RUNNING APP. Permissions are checked when
    # the file is opened, and FoodYou holds the database open for its whole
    # lifetime -- the note under DISRUPTION_DB in this file said so, and the
    # 2026-08-23 sweep proved it: the mode changed, check_faults.sh reported BITES
    # on that basis, and the app carried on unaffected. The self-test was
    # confirming the file mode, not the effect on the SUT.
    #
    # Forcing a re-open is what makes the fault reach the app, the same shape as
    # UE1_KILL. Confirmed live: with the database unreadable at launch FoodYou
    # shows "Oops! Something went wrong" plus the SQLiteCantOpenDatabaseException.
    inject:  "run-as {pkg} chmod 0000 {db} ; am force-stop {pkg} ; am start -n {pkg}/.app.infrastructure.android.MainActivity"
    restore: "run-as {pkg} chmod 0660 {db} ; am force-stop {pkg} ; am start -n {pkg}/.app.infrastructure.android.MainActivity"

  INPUT_INVALID:                    # invalid amount is typed by the SI itself (empty)
    timing: none
    mechanism: none

# --- contract note (retained) ----------------------------------------------
# DISRUPTION_DB / STORAGE_FULL / UE1_KILL are expected ABSORBED: FoodYou reads the
# authoritative total back, so a failed/aborted write yields the unchanged
# (consistent) total, not a distinct wrong observable. DB_CORRUPT / CACHE_STALE /
# STORAGE_MEDIA are the integrity faults where a STRICT oracle likely finds a
# counter-example (the app trusts its own DB and has no detect/error path).
