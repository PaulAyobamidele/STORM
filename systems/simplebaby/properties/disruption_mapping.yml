# --- SimpleBaby forecast, written 2026-09-29 from notes/observed_behaviour.md
# section 10, BEFORE any run. Never adjusted after a run; a verdict that
# disagrees is reported as such. S = signed in, G = guest.
#   UE_KILL              PASS   consistent: one insert, whole or nothing (S, G)
#   UE_OFFLINE           PASS   O4: the error is returned and alerted (S)
#   UE_STORAGE_FULL      PASS   O4: AsyncStorage write rejects, reported (G)
#   APP_KEY_LOST         FAIL   O2: key recreated silently, records unreadable (S G)
#   APP_CACHE_STALE      FAIL   O3: zero-row delete, list drops the card anyway (S)
#   APP_UNAVAILABLE      PASS   O4: PostgREST down, error alerted (S)
#   DB_ABORT             PASS   O4: trigger exception alerted (S)
#   DB_CORRUPT           PASS   O5: "[Decryption Failed]" shown in the field
#   DB_CORRUPT_LOCAL     FAIL   O5 then O2: read as empty, next save wipes the table
#   DB_DATA_LOST         FAIL   O2: the history shows the empty sentence, no report (S)
#   INFRA_DB_DOWN        FAIL   O4: request hangs, no client timeout (S)
#   INFRA_DOZE           FAIL   O6: stopwatch counts ticks, to confirm live
#   INFRA_STORAGE_MEDIA  FAIL   O5: unreadable store shown as empty history (G)
#   INPUT_INVALID        PASS   O1: "Missing Information" alert
#   INPUT_OVERNIGHT      FAIL   a valid overnight sleep is refused
# DB_DATA_LOST added 2026-09-29 (phase C) at the user's request, before any run.
# Names aligned with specification_simplebaby.lnt on 2026-09-29 (phase B),
# before any run; no forecast changed. Left out of the specification, with
# their forecasts, in notes/DISRUPTION_COVERAGE.md: session expiry (PASS),
# external API (PASS), over-limit (open), future time (accepted by design).
# ---------------------------------------------------------------------------

# disruption_mapping.yml -- how each SimpleBaby fault is injected, out of
# band, and how it is undone. Android schema (framework/concretization/
# fault_injector.py): `mechanism: sqlite | adb | host | connectivity | none`.
#   adb   one device-shell command per ';'-separated part (use && inside a
#         part). adbd runs as ROOT (env.sh runs `adb root`): the release build
#         is not debuggable, so run-as is not available and paths are absolute.
#   host  one bash command on the Mac, for the Supabase stack (Docker). The
#         device is "$DEVICE" (env.sh). SQL runs through psql in the db container.
# Every fault carries inject / restore / verify_injected / verify_restored;
# the probes are read through the fault's mechanism unless they name one.
#
# TIMING. The account or guest session and the first child are created by
# the SI inside the walk, so every fault is `gate`: the SI places the gate
# before the first tap it shares with the nominal arm (the save tap, the
# history open, the delete confirm). UE_KILL is realised by the SI's own
# relaunch (timing none).
#
# READ-BACK. A fault stays in place until the walk ends. The three that would
# also break the history read-back after the owed error (network off, REST
# stopped, database paused) undo themselves after a delay in the background,
# so the read-back reads the store rather than a second failure. The delay
# (25 s) must outlast the walker's 15 s observation window: with 8 s, the REST
# outage ended inside the window, the held save went through and the app said
# "saved" (2026-10-01, app_unavailable, superseded), so the fault had not
# outlasted the question put to the app.

android:
  package: com.anonymous.bt_sdk53
  db: databases/RKStorage                          # AsyncStorage (guest mode)
  seed_script: systems/simplebaby/seed.sh          # pm clear + launch to the welcome screen

faults:

  UE_KILL:                         # the app is killed right after the save tap
    # Realised by the SI: its navigate (rt_home) right after the tap is
    # terminate + activate. The insert is one statement, so it lands whole or
    # not at all (observed_behaviour §4); the purpose accepts both.
    timing: none
    mechanism: none

  UE_OFFLINE:                      # the device network is off before the save
    timing: gate
    mechanism: host
    inject: >-
      adb -s "$DEVICE" shell svc wifi disable && adb -s "$DEVICE" shell svc data disable &&
      ( (sleep 25; adb -s "$DEVICE" shell svc wifi enable; adb -s "$DEVICE" shell svc data enable) >/dev/null 2>&1 & )
    restore: 'adb -s "$DEVICE" shell svc wifi enable && adb -s "$DEVICE" shell svc data enable'
    verify_injected: { payload: 'adb -s "$DEVICE" shell settings get global wifi_on', equals: "0" }
    verify_restored: { payload: 'adb -s "$DEVICE" shell settings get global wifi_on', equals: "1" }

  UE_STORAGE_FULL:                 # the device's data partition is full (guest)
    # As root, dd fills /data until ENOSPC; the app's AsyncStorage write then
    # fails (observed_behaviour §4, guest create). `|| true`: dd exits non-zero
    # when the disk is full, which is the point.
    timing: gate
    mechanism: adb
    timeout: 180
    inject:  "dd if=/dev/zero of=/data/local/tmp/fault_ballast bs=1048576 2>/dev/null || true"
    restore: "rm -f /data/local/tmp/fault_ballast"
    verify_injected: { payload: "test -f /data/local/tmp/fault_ballast && echo full || echo free", equals: "full" }
    verify_restored: { payload: "test -f /data/local/tmp/fault_ballast && echo full || echo free", equals: "free" }

  APP_UNAVAILABLE:                 # the REST service behind Kong is stopped
    timing: gate
    mechanism: host
    inject: >-
      docker stop supabase_rest_SimpleBaby >/dev/null &&
      ( (sleep 25; docker start supabase_rest_SimpleBaby) >/dev/null 2>&1 & )
    restore: "docker start supabase_rest_SimpleBaby >/dev/null"
    verify_injected: { payload: "docker inspect -f '{{.State.Running}}' supabase_rest_SimpleBaby", equals: "false" }
    verify_restored: { payload: "docker inspect -f '{{.State.Running}}' supabase_rest_SimpleBaby", equals: "true" }

  APP_KEY_LOST:                    # the device encryption key is removed
    # Only the ENCRYPTION_KEY entry of SecureStore goes; the session keys stay,
    # so a signed-in user is still signed in. The relaunch makes the app
    # re-read SecureStore; it then creates a new key silently (§4.4).
    # Nothing to restore: the next run's seed clears the app.
    timing: gate
    mechanism: adb
    inject: "sed -i '/key_v1-ENCRYPTION_KEY/d' /data/data/{pkg}/shared_prefs/SecureStore.xml && am force-stop {pkg} && am start -n {pkg}/.MainActivity"
    restore: ""
    verify_injected: { payload: "grep -c key_v1-ENCRYPTION_KEY /data/data/{pkg}/shared_prefs/SecureStore.xml || true", equals: "0" }
    verify_restored: { mechanism: host, payload: "echo cleared-by-seed", equals: "cleared-by-seed" }

  APP_CACHE_STALE:                 # the delete is silently cancelled in the store
    # A BEFORE DELETE trigger that returns NULL: Postgres skips the row, and
    # PostgREST answers "no error". The app drops the card from its own copy
    # of the list (observed_behaviour §4.2).
    timing: gate
    mechanism: host
    inject: >-
      docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc
      "CREATE OR REPLACE FUNCTION fault_keep_row() RETURNS trigger AS \$\$ BEGIN RETURN NULL; END \$\$ LANGUAGE plpgsql;
      DROP TRIGGER IF EXISTS fault_keep_row ON feeding_logs;
      CREATE TRIGGER fault_keep_row BEFORE DELETE ON feeding_logs FOR EACH ROW EXECUTE FUNCTION fault_keep_row();"
    restore: >-
      docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc
      "DROP TRIGGER IF EXISTS fault_keep_row ON feeding_logs; DROP FUNCTION IF EXISTS fault_keep_row();"
    verify_injected: { payload: "docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc \"SELECT count(*) FROM pg_trigger WHERE tgname = 'fault_keep_row'\"", equals: "1" }
    verify_restored: { payload: "docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc \"SELECT count(*) FROM pg_trigger WHERE tgname = 'fault_keep_row'\"", equals: "0" }

  DB_ABORT:                        # the feeding insert raises in Postgres
    timing: gate
    mechanism: host
    inject: >-
      docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc
      "CREATE OR REPLACE FUNCTION fault_abort_write() RETURNS trigger AS \$\$ BEGIN RAISE EXCEPTION 'injected transaction abort'; END \$\$ LANGUAGE plpgsql;
      DROP TRIGGER IF EXISTS fault_abort_write ON feeding_logs;
      CREATE TRIGGER fault_abort_write BEFORE INSERT ON feeding_logs FOR EACH ROW EXECUTE FUNCTION fault_abort_write();"
    restore: >-
      docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc
      "DROP TRIGGER IF EXISTS fault_abort_write ON feeding_logs; DROP FUNCTION IF EXISTS fault_abort_write();"
    verify_injected: { payload: "docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc \"SELECT count(*) FROM pg_trigger WHERE tgname = 'fault_abort_write'\"", equals: "1" }
    verify_restored: { payload: "docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc \"SELECT count(*) FROM pg_trigger WHERE tgname = 'fault_abort_write'\"", equals: "0" }

  DB_CORRUPT:                      # a stored ciphertext is damaged
    # The item name's last eight characters are overwritten; the OpenSSL
    # marker at its start survives, so the app tries to decrypt and fails
    # (crypto.ts safeDecrypt). Fresh account per run: nothing to restore.
    timing: gate
    mechanism: host
    inject: "docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc \"UPDATE feeding_logs SET item_name = left(item_name, length(item_name) - 8) || 'AAAAAAAA'\""
    restore: ""
    verify_injected: { payload: "docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc \"SELECT count(*) FROM feeding_logs WHERE right(item_name, 8) = 'AAAAAAAA'\"", equals: "1" }
    verify_restored: { payload: "echo fresh-account-per-run", equals: "fresh-account-per-run" }

  DB_CORRUPT_LOCAL:                # the on-device feeding table is damaged (guest)
    # The JSON array loses its last five characters; getJson then fails to
    # parse it and returns [] (local-store.ts:43-51). Paren-free probe.
    timing: gate
    mechanism: adb
    inject: "sqlite3 /data/data/{pkg}/databases/RKStorage \"UPDATE catalystLocalStorage SET value = substr(value, 1, length(value) - 5) WHERE key = 'sb:table:feeding_logs'\""
    restore: ""
    verify_injected: { payload: "sqlite3 /data/data/{pkg}/databases/RKStorage \"SELECT value LIKE '%]' FROM catalystLocalStorage WHERE key = 'sb:table:feeding_logs'\"", equals: "0" }
    verify_restored: { mechanism: host, payload: "echo cleared-by-seed", equals: "cleared-by-seed" }

  DB_DATA_LOST:                    # a saved row is deleted in Postgres after the save
    timing: gate
    mechanism: host
    inject: "docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc \"DELETE FROM feeding_logs\""
    restore: ""
    verify_injected: { payload: "docker exec -i supabase_db_SimpleBaby psql -U postgres -d postgres -tAc \"SELECT count(*) FROM feeding_logs\"", equals: "0" }
    verify_restored: { payload: "echo fresh-account-per-run", equals: "fresh-account-per-run" }

  INFRA_DB_DOWN:                   # the database container is paused across the save
    # The pause is in the foreground; only the delayed unpause is in the
    # background, in its own subshell, so the probe runs after the pause.
    timing: gate
    mechanism: host
    inject: >-
      docker pause supabase_db_SimpleBaby >/dev/null &&
      ( (sleep 25; docker unpause supabase_db_SimpleBaby) >/dev/null 2>&1 & )
    restore: "docker unpause supabase_db_SimpleBaby >/dev/null 2>&1 || true"
    verify_injected: { payload: "docker inspect -f '{{.State.Paused}}' supabase_db_SimpleBaby", equals: "true" }
    verify_restored: { payload: "docker inspect -f '{{.State.Paused}}' supabase_db_SimpleBaby", equals: "false" }

  INFRA_STORAGE_MEDIA:             # the on-device store is made unreadable (guest)
    # The mode change alone does nothing to a running app that holds the file
    # open; the force-stop + relaunch makes it reopen it. 660 is the mode the
    # platform created (notes/ui, run-as listing).
    timing: gate
    mechanism: adb
    inject: "chmod 000 /data/data/{pkg}/databases/RKStorage && am force-stop {pkg} && am start -n {pkg}/.MainActivity"
    restore: "chmod 660 /data/data/{pkg}/databases/RKStorage"
    verify_injected: { payload: "stat -c %a /data/data/{pkg}/databases/RKStorage", equals: "0" }
    verify_restored: { payload: "stat -c %a /data/data/{pkg}/databases/RKStorage", equals: "660" }

  INFRA_DOZE:                      # a minute in the background under Doze
    # HOME, forced deep idle, 60 s, the idle state recorded, Doze released, the
    # app brought back (singleTask: the running stopwatch screen resumes).
    # Live, plain backgrounding stopped the stopwatch just the same (dumps 26, 27).
    timing: gate
    mechanism: adb
    timeout: 90
    inject: "input keyevent KEYCODE_HOME ; dumpsys deviceidle force-idle ; sleep 60 ; dumpsys deviceidle get deep > /data/local/tmp/fault_doze_state ; dumpsys deviceidle unforce ; am start -n {pkg}/.MainActivity"
    restore: "dumpsys deviceidle unforce ; rm -f /data/local/tmp/fault_doze_state"
    verify_injected: { payload: "cat /data/local/tmp/fault_doze_state", equals: "IDLE" }
    verify_restored: { payload: "dumpsys deviceidle get deep", equals: "ACTIVE" }

  # parameter-borne variants: no injection, the SI types the value
  INPUT_INVALID:
    timing: none
    mechanism: none
  INPUT_OVERNIGHT:
    timing: none
    mechanism: none
