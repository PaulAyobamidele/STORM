# disruption_mapping.yml -- how each fault gate is injected into the running
# SUT, out of band (never through the UI), and how it is undone.
#
# CONTRACT (framework/concretization/fault_injector.py for Android,
# disruptor.py for web / shell):
#   * `faults:` keys are EXACTLY the fault gate names of the specification.
#     The walker derives the target fault from the test case's file name
#     (tc_<fault>.aut, upper-cased) and looks it up here; a purpose whose
#     file name is not a key runs UNTARGETED, silently. The nominal purpose is
#     the only one that should.
#   * timing:  pre  = inject once before the walk (the fault pre-exists)
#              gate = inject when the fault's label is reached in the walk
#              none = no out-of-band injection (the SI itself drives it)
#   * Android:  mechanism: sqlite | adb | connectivity | none;
#               {pkg} and {db} are the only substitution tokens; adb commands
#               are split on ';' (use && inside a compound command);
#               restore: a command, "" (nothing) or reseed (runs seed_script).
#   * Web:      mechanisms: named argv commands (postgres, shell, http ...);
#               faults carry mechanism / inject / restore and, for each, a
#               verify_injected / verify_restored probe {payload, equals}.
#               Without probes the fault state is ASSUMED, and a fault that
#               does not manifest yields a PASS that means nothing.
#
# THREE RULES THE CAMPAIGNS PAID FOR
#   1. One fault, one mechanism. Three names over byte-identical commands are
#      three rows in a results table that cannot disagree.
#   2. Every injection must be proved to BITE and to LET GO on the device
#      before a sweep (check_faults: record state, inject, assert changed,
#      restore, assert changed back). A fault that bites and does not let go
#      poisons every later run.
#   3. Injection must reach the SUT's running state. A permission change on a
#      file the SUT already holds open does nothing; forcing a re-open does.
#      A fault armed at its gate fires AFTER the concrete steps that precede
#      the gate -- for a write-path fault, after the commit. Arm those before
#      the write (timing: pre) or the purpose tests nothing.

# HOLE 34  the platform block (delete the one you do not use)
android:
  package: com.example.sutname                 # else taken from --device-config
  db: databases/sutname.db                     # the SUT's store, relative to its data dir
  seed_script: systems/sutname/seed.sh         # what `restore: reseed` runs

# web SUTs instead:
# mechanisms:
#   postgres:
#     command: ["docker", "exec", "-i", "db-container", "psql", "-U", "app", "-d", "app", "-c"]
#     timeout: 60
#   shell:
#     command: ["bash", "-lc"]
#     cwd: "{{PROJECT_ROOT}}"
#     timeout: 60

# HOLE 35  one entry per fault gate; INPUT_INVALID as the parameter-borne one
faults:

  UE_KILL:                          # process killed mid-write, then relaunched
    # PROCESS layer. The relaunch is part of the injection: the SUT reopens on
    # home, which is where the SI's next step expects to be. Whether the
    # in-flight write committed depends on timing, and that is a property of
    # the SUT, not a defect in the injection: if it reports COMMITTED where
    # the specification targets the abort branch, investigate rather than
    # weaken the specification. A kill at the gate lands after the commit;
    # there is no framework timing for "between the tap and its completion",
    # so state in the results what this fault actually exercised.
    timing: gate
    mechanism: adb
    inject:  "am force-stop {pkg} ; am start -n {pkg}/.MainActivity"
    restore: ""                     # the relaunch above is the restore

  DB_ABORT:                         # write transaction aborts
    # SQL layer: the insert raises, the transaction rolls back, the SUT's
    # persistence layer surfaces the exception. Literally what "the write
    # aborts" means, and it does not touch rows already committed. Armed
    # BEFORE the walk so the purpose's write is the one that aborts.
    timing: pre
    mechanism: sqlite
    inject:  "CREATE TRIGGER IF NOT EXISTS fault_abort_write BEFORE INSERT ON Record BEGIN SELECT RAISE(ABORT, 'injected transaction abort'); END"
    restore: "DROP TRIGGER IF EXISTS fault_abort_write"

  INFRA_STORAGE_FULL:               # write fails for lack of storage
    # FILESYSTEM layer: ENOSPC is returned on the write itself regardless of
    # when the handle was opened. Ballast sized from live free space with
    # headroom so the rest of the platform keeps running. `&&` throughout:
    # the injector splits on ';'.
    timing: pre
    mechanism: adb
    inject:  "run-as {pkg} sh -c 'FREE=$(df -k . | tail -1 | tr -s \" \" | cut -d\" \" -f4) && dd if=/dev/zero of=files/fault_ballast bs=1024 count=$((FREE-20480)) 2>/dev/null && sync'"
    restore: "run-as {pkg} rm -f files/fault_ballast"

  DB_CORRUPT:                       # a stored record is unsound
    # Targets the items under test BY NAME (a fixture prefix would corrupt
    # rows nothing looks at). That means writing to SHIPPED data, so restore
    # writes the authoritative values back explicitly -- the same values as
    # Value.abstract_values in type_description.yml. If a run is interrupted
    # between inject and restore the catalogue stays corrupted; the
    # environment check must assert the values before every run.
    timing: pre
    mechanism: sqlite
    inject:  "UPDATE Item SET value = NULL WHERE name IN ('Item A','Item B','Item C')"
    restore: "UPDATE Item SET value = 100 WHERE name = 'Item A'; UPDATE Item SET value = 250 WHERE name = 'Item B'; UPDATE Item SET value = 400 WHERE name = 'Item C'"

  APP_CACHE_STALE:                  # a cached value drifted from its source
    # Must change the value UNDERNEATH a cache the SUT already holds. If the
    # SUT has no cache and reads its store live, rewriting the store makes
    # the stale value the new truth, and the INFO oracle then punishes the
    # correct behaviour: the purpose is uninterpretable until the injection
    # targets an actual cache (HOLE 36: where does this SUT cache?).
    timing: pre
    mechanism: sqlite
    inject:  "UPDATE Item SET value = 999 WHERE name IN ('Item A','Item B','Item C')"
    restore: "UPDATE Item SET value = 100 WHERE name = 'Item A'; UPDATE Item SET value = 250 WHERE name = 'Item B'; UPDATE Item SET value = 400 WHERE name = 'Item C'"

  INFRA_STORAGE_MEDIA:              # the store becomes unreadable
    # The mode change alone does nothing to a running SUT that holds the file
    # open; the force-stop + relaunch is what makes the fault reach it.
    # Restore to the mode the platform CREATED the file with (check with
    # stat -c %a before the first run), or every run leaves the file a little
    # more restricted than it found it.
    timing: gate
    mechanism: adb
    inject:  "run-as {pkg} chmod 0000 {db} ; am force-stop {pkg} ; am start -n {pkg}/.MainActivity"
    restore: "run-as {pkg} chmod 0660 {db} ; am force-stop {pkg} ; am start -n {pkg}/.MainActivity"

  APP_EXTAPI_FAIL:                  # the external dependency is unreachable
    # The restore runs only on the normal path; an interrupted run leaves the
    # device offline and every later run sees an unreachable source. The
    # environment check must prove the source reachable before each run, or
    # "the device was offline" and "the SUT's fetch is broken" produce the
    # same FAIL.
    timing: gate
    mechanism: connectivity
    inject:  "svc data disable ; svc wifi disable"
    restore: "svc data enable ; svc wifi enable"

  INPUT_INVALID:                    # the invalid input is typed by the SI itself
    timing: none
    mechanism: none

# --- expectations, stated before the run, never adjusted after ------------
# HOLE 37  For each fault: is the SUT expected to ABSORB it (read the
# authoritative state back, so a failed write yields the unchanged, consistent
# band) or to DETECT it (an observable is owed)? Write the honest expectation
# here and let the verdict fall where it falls.
